[package]
name = "file-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
toml_edit = "0.22"
tokio-util = { version = "0.7", features = ["io"] }
dirs = "7.0.0"
rand = "0.9"
argon2 = "0.5"
aes-gcm = "0.10"
futures-util = "0.3"

# --- GUI (лёгкий нативный интерфейс: eframe/egui, без tauri/Electron/WebView) ---
eframe = "0.31"                 # immediate-mode GUI, рендер через glow/wgpu
qrcode = { version = "0.14", default-features = false, features = ["image"] }  # генерация QR-кода (растровый рендер)
image = { version = "0.25", default-features = false }   # растр QR -> пиксели для egui
local-ip-address = "0.6"        # определение локального IP в LAN
open = "5"                      # открыть ссылку/папку в системном браузере/проводнике
http-body = "1"
# Нативный диалог выбора папки для кнопки «Выбрать папку…» в GUI
# (async-закрытия не нужны — используем синхронный API из GUI-потока).
rfd = { version = "0.15", optional = true }

[features]
default = ["gui-folder-picker"]
# Кнопка выбора папки хранилища через нативный диалог ОС (крейт rfd).
gui-folder-picker = ["dep:rfd"]
